spring:
  application:
    name: fresh-fruit-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fresh_fruit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

freshfruit:
  order:
    unpaid-timeout-minutes: ${ORDER_UNPAID_TIMEOUT_MINUTES:15}
    expiration-scan-ms: ${ORDER_EXPIRATION_SCAN_MS:60000}
  product-images:
    storage-dir: ${PRODUCT_IMAGE_STORAGE_DIR:./uploads/products}
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:./uploads/avatars}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME}
    initial-password: ${ADMIN_INITIAL_PASSWORD}

logging:
  level:
    com.fairyshalltear.freshfruit: info
